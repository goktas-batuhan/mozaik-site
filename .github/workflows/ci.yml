name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # typecheck, client build, SSR build, prerender
      - run: npm run build
      # 51 routes without runtime errors, axe WCAG 2 A/AA on the main pages
      - run: npx playwright test
